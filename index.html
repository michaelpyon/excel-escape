<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Escape: Formula Dungeon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen">
            <div class="start-content">
                <h1 class="game-logo">EXCEL ESCAPE</h1>
                <p class="subtitle">Formula Dungeon</p>
                <div class="start-art">
                    <span class="start-spike left-start-spike"></span>
                    <span class="start-character">&#x1F9D1;</span>
                    <span class="start-spike right-start-spike"></span>
                </div>
                <p class="tagline">Solve spreadsheet puzzles before the walls crush you!</p>
                <button id="start-btn" class="btn-primary">START GAME</button>
                <p class="controls-hint">Use keyboard shortcuts like a real spreadsheet pro</p>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <!-- Header -->
            <header id="game-header">
                <div class="header-left">
                    <h1 class="header-title">EXCEL ESCAPE</h1>
                </div>
                <div class="header-center">
                    <span id="room-title">The Sum Dungeon</span>
                    <span class="room-counter">Room <span id="room-num">1</span>/10</span>
                </div>
                <div class="header-right">
                    <div class="timer-display" id="timer-display">
                        <span class="timer-icon">&#x23F1;</span>
                        <span id="time-left">45</span>s
                    </div>
                    <div class="score-display">
                        <span class="score-icon">&#x2B50;</span>
                        <span id="score-val">0</span>
                    </div>
                </div>
            </header>

            <!-- Game Viewport -->
            <div id="game-viewport">
                <div id="room">
                    <div class="ceiling"></div>
                    <div class="floor"></div>
                    <div id="left-wall" class="spike-wall">
                        <div class="wall-body"></div>
                        <div class="spikes"></div>
                    </div>
                    <div id="right-wall" class="spike-wall">
                        <div class="spikes"></div>
                        <div class="wall-body"></div>
                    </div>
                    <div id="character">
                        <div class="char-body">&#x1F9D1;</div>
                        <div class="char-shadow"></div>
                    </div>
                    <div id="door">
                        <div class="door-frame">
                            <div class="door-body">&#x1F6AA;</div>
                            <div class="door-lock" id="door-lock">&#x1F512;</div>
                        </div>
                    </div>
                    <div id="key-popup" class="hidden">
                        <span>&#x1F511;</span>
                    </div>
                    <div id="danger-overlay"></div>
                </div>
            </div>

            <!-- Challenge Panel -->
            <div id="challenge-panel">
                <div class="challenge-left">
                    <span class="challenge-icon">&#x1F3AF;</span>
                    <span id="challenge-text">Enter =SUM(A1:A3) in cell B1</span>
                </div>
                <div class="challenge-right">
                    <div class="shortcut-badge">
                        <span class="kbd-icon">&#x2328;</span>
                        <span id="shortcut-tip">Press ENTER to confirm</span>
                    </div>
                </div>
            </div>

            <!-- Spreadsheet Area -->
            <div id="spreadsheet-container">
                <div id="formula-bar">
                    <span id="cell-name">A1</span>
                    <span id="fx-label">fx</span>
                    <input id="formula-input" type="text" spellcheck="false" autocomplete="off">
                </div>
                <div id="grid-wrapper">
                    <table id="spreadsheet">
                        <!-- Generated by JS -->
                    </table>
                </div>
            </div>

            <!-- Check Button -->
            <div id="action-bar">
                <button id="check-btn" class="btn-check">Check Answer &#x2713;</button>
                <div id="feedback-msg"></div>
            </div>
        </div>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="hidden">
            <div id="modal">
                <div id="modal-icon"></div>
                <h2 id="modal-title"></h2>
                <p id="modal-message"></p>
                <div id="modal-stats" class="hidden">
                    <div class="stat-row"><span>Time Bonus:</span><span id="stat-time">0</span></div>
                    <div class="stat-row"><span>Room Score:</span><span id="stat-room">0</span></div>
                </div>
                <button id="modal-btn" class="btn-primary"></button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
